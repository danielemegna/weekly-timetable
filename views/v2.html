<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff6da">
    <title>Turni in Gattile - Animal's Emergency</title>
    <link rel="stylesheet" href="css/pure-min.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div id="header">
      <prev-button id="prev-button"></prev-button>
      <img width="140px" src="./img/logo.png" onClick="goToFirstWeek()" />
      <next-button id="next-button"></next-button>
    </div>
    <table id="time-table" class="pure-table pure-table-bordered purple">
      <thead>
        <tr>
          <th>{{monthYear monday}}</th>
          <th>Mattino</th>
          <th>Pomeriggio</th>
        </tr>
      </thead>
      <tbody>
        {{#each db.shifts}}
          <tr>
            <td>{{weekdayLabel ../monday @index}} {{dayOfMonth ../monday @index}}</td>
            <td class="{{shiftClass (lookup this 0)}}">{{joinNames (lookup this 0)}}</td>
            <td class="{{shiftClass (lookup this 1)}}">{{joinNames (lookup this 1)}}</td>
          </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if db.notes }}
      <div id="week-notes" class="full">{{db.notes}}</div>
    {{else}}
      <div id="week-notes" class="hidden"></div>
    {{/if}}
    <script>
      function goToFirstWeek() {
        var visitingUrlSearchParams = new URLSearchParams(location.search)
        visitingUrlSearchParams.delete('weekNumber')
        location.search = visitingUrlSearchParams.toString()
      }
    </script>
  </body>
</html>
